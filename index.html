// ============ ДВИЖОК ИГРЫ ============
const bgEl = document.getElementById('background');
const charEl = document.getElementById('character');
const dialogueBox = document.getElementById('dialogue-box');
const speakerName = document.getElementById('speaker-name');
const dialogueText = document.getElementById('dialogue-text');
const choicesContainer = document.getElementById('choices-container');
const titleScreen = document.getElementById('title-screen');

function startGame() {
  titleScreen.classList.add('hidden');
  dialogueBox.classList.remove('hidden');
  loadScene('start');
}

function loadScene(sceneId) {
  const scene = scenes[sceneId];
  if (!scene) return;
  
  gameState.currentScene = sceneId;
  
  // Обработка концовки
  if (scene.type === 'ending') {
    showEnding(scene);
    return;
  }
  
  // Фон
  if (scene.bg) {
    bgEl.style.backgroundImage = `url('${scene.bg}')`;
  }
  
  // Персонаж
  if (scene.character) {
    charEl.src = scene.character;
    charEl.classList.remove('hidden');
  } else {
    charEl.classList.add('hidden');
  }
  
  // Диалог
  speakerName.textContent = scene.speaker || '';
  typeWriter(scene.text, dialogueText);
  
  // Выбор или продолжение
  choicesContainer.innerHTML = '';
  choicesContainer.classList.add('hidden');
  
  if (scene.choices) {
    // Ждём окончания анимации текста
    setTimeout(() => {
      showChoices(scene.choices);
    }, scene.text.length * 30 + 500);
  } else if (scene.next) {
    dialogueBox.onclick = () => {
      dialogueBox.onclick = null;
      loadScene(scene.next);
    };
  }
}

function typeWriter(text, element) {
  element.textContent = '';
  let i = 0;
  const speed = 25;
  function type() {
    if (i < text.length) {
      element.textContent += text.charAt(i);
      i++;
      setTimeout(type, speed);
    }
  }
  type();
}

function showChoices(choices) {
  choicesContainer.classList.remove('hidden');
  choices.forEach(choice => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = choice.text;
    btn.onclick = () => {
      if (choice.effect) {
        Object.keys(choice.effect).forEach(key => {
          gameState[key] = (gameState[key] || 0) + choice.effect[key];
        });
      }
      choicesContainer.classList.add('hidden');
      loadScene(choice.next);
    };
    choicesContainer.appendChild(btn);
  });
}

function showEnding(scene) {
  bgEl.style.backgroundImage = scene.ending === 1 ? "url('bg_city.jpg')" :

                                "url('bg_city.jpg')";
  charEl.classList.add('hidden');
  dialogueBox.classList.add('hidden');
  
  const endDiv = document.createElement('div');
  endDiv.className = 'ending-screen fade-in';
  
  const color = scene.ending === 1 ? '#44ff44' : scene.ending === 2 ? '#ffaa44' : '#ff4444';
  endDiv.innerHTML = `
    <h2 style="color:${color}">${scene.title}</h2>
    <p style="white-space: pre-line">${scene.text}</p>
    <button onclick="location.reload()">НАЧАТЬ ЗАНОВО</button>
  `;
  document.getElementById('game-container').appendChild(endDiv);
}
</script>
